<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ESP32-S3 Voice Control</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px 15px;
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            text-align: center;
        }

        .container {
            max-width: 450px;
            margin: auto;
            padding: 25px;
            background: #1e293b;
            border-radius: 16px;
        }

        h1 {
            font-size: 25px;
            margin-bottom: 25px;
        }

        button {
            width: 100%;
            padding: 16px;
            margin: 9px 0;
            border: none;
            border-radius: 9px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #connectButton {
            background: #2563eb;
            color: white;
        }

        #listenButton {
            background: #16a34a;
            color: white;
        }

        #listenButton.listening {
            background: #dc2626;
        }

        .panel {
            margin-top: 20px;
            padding: 15px;
            background: #0f172a;
            border-radius: 10px;
        }

        .command-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .command {
            padding: 13px 5px;
            background: #334155;
            border-radius: 8px;
            font-weight: bold;
        }

        .command.active {
            background: #15803d;
        }

        #recognizedText {
            font-size: 18px;
            min-height: 28px;
            overflow-wrap: anywhere;
        }

        #detectedCommand {
            color: #38bdf8;
            font-weight: bold;
        }

        #log {
            text-align: left;
            font-size: 13px;
            overflow-wrap: anywhere;
            max-height: 180px;
            overflow-y: auto;
        }

        .small {
            color: #94a3b8;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>ESP32-S3 Voice Control</h1>

        <!-- BLE CONNECTION -->

        <button id="connectButton">
            Connect to ESP32
        </button>

        <div class="panel">
            <p id="connectionStatus">
                Bluetooth: Disconnected
            </p>
        </div>


        <!-- MICROPHONE CONTROL -->

        <button id="listenButton" disabled>
            Start Listening
        </button>

        <p class="small">
            Microphone automatically stops after 3 seconds.
        </p>


        <!-- SUPPORTED COMMANDS -->

        <div class="panel">

            <h3>Supported Voice Commands</h3>

            <div class="command-list">

                <div class="command" id="cmd-1">ON</div>

                <div class="command" id="cmd-2">OFF</div>

                <div class="command" id="cmd-3">STOP</div>

                <div class="command" id="cmd-4">HELP</div>

                <div class="command" id="cmd-5">EMERGENCY</div>

                <div class="command" id="cmd-6">MAYDAY</div>

            </div>

        </div>


        <!-- RECOGNIZED SPEECH -->

        <div class="panel">

            <h3>Recognized Speech</h3>

            <p id="recognizedText">
                Waiting for speech...
            </p>

            <p id="detectedCommand">
                Detected command: None
            </p>

        </div>


        <!-- COMMUNICATION LOG -->

        <div class="panel">

            <h3>Communication Log</h3>

            <div id="log">
                System ready.
            </div>

        </div>

    </div>


    <script>

        // ==========================================
        // 1. BLE CONFIGURATION
        // ==========================================

        const SERVICE_UUID =
            "000000ff-0000-1000-8000-00805f9b34fb";

        const CHARACTERISTIC_UUID =
            "0000ff01-0000-1000-8000-00805f9b34fb";

        const DEVICE_NAME = "VOICE_CONTROL";


        // ==========================================
        // 2. COMMAND DEFINITIONS
        // ==========================================

        const commands = {

            1: "ON",
            2: "OFF",
            3: "STOP",
            4: "HELP",
            5: "EMERGENCY",
            6: "MAYDAY"

        };


        // ==========================================
        // 3. GLOBAL VARIABLES
        // ==========================================

        let bleDevice = null;

        let bleCharacteristic = null;

        let recognition = null;

        let isListening = false;

        let listeningTimer = null;

        let recognizedTranscript = "";

        let sessionEnded = false;


        // ==========================================
        // 4. HTML ELEMENT REFERENCES
        // ==========================================

        const connectButton =
            document.getElementById("connectButton");

        const listenButton =
            document.getElementById("listenButton");

        const connectionStatus =
            document.getElementById("connectionStatus");

        const recognizedText =
            document.getElementById("recognizedText");

        const detectedCommand =
            document.getElementById("detectedCommand");

        const logElement =
            document.getElementById("log");


        // ==========================================
        // 5. LOG FUNCTION
        // ==========================================

        function addLog(message) {

            const time = new Date().toLocaleTimeString();

            const entry = document.createElement("p");

            entry.textContent = `[${time}] ${message}`;

            logElement.appendChild(entry);

            logElement.scrollTop =
                logElement.scrollHeight;
        }


        // ==========================================
        // 6. COMMAND HIGHLIGHT
        // ==========================================

        function highlightCommand(id) {

            document.querySelectorAll(".command").forEach(element => {

                element.classList.remove("active");

            });

            if (id !== null) {

                const selected =
                    document.getElementById("cmd-" + id);

                if (selected) {

                    selected.classList.add("active");

                }
            }
        }


        // ==========================================
        // 7. BLE CONNECTION
        // ==========================================

        async function connectBLE() {

            try {

                if (!navigator.bluetooth) {

                    throw new Error(
                        "Web Bluetooth is unavailable. Use Chrome on Android."
                    );

                }

                connectionStatus.textContent =
                    "Bluetooth: Searching...";

                addLog("Searching for " + DEVICE_NAME);

                bleDevice =
                    await navigator.bluetooth.requestDevice({

                        filters: [
                            { name: DEVICE_NAME }
                        ],

                        optionalServices: [SERVICE_UUID]

                    });


                bleDevice.addEventListener(
                    "gattserverdisconnected",
                    handleDisconnect
                );


                connectionStatus.textContent =
                    "Bluetooth: Connecting...";


                const server =
                    await bleDevice.gatt.connect();


                const service =
                    await server.getPrimaryService(SERVICE_UUID);


                bleCharacteristic =
                    await service.getCharacteristic(
                        CHARACTERISTIC_UUID
                    );


                connectionStatus.textContent =
                    "Bluetooth: Connected to " + bleDevice.name;


                listenButton.disabled = false;

                addLog("BLE connection established.");

                addLog("GATT characteristic discovered.");

            }

            catch (error) {

                connectionStatus.textContent =
                    "Bluetooth: Connection failed";

                addLog("Connection error: " + error.message);

            }
        }


        // ==========================================
        // 8. DISCONNECTION HANDLING
        // ==========================================

        function handleDisconnect() {

            if (isListening) {

                stopListening();

            }

            bleCharacteristic = null;

            connectionStatus.textContent =
                "Bluetooth: Disconnected";

            listenButton.disabled = true;

            addLog("ESP32 disconnected.");

        }


        // ==========================================
        // 9. SEND ONE RAW BYTE THROUGH BLE
        // ==========================================

        async function sendCommand(id) {

            if (!bleCharacteristic) {

                addLog("ERROR: ESP32 is not connected.");

                return;
            }

            try {

                // Create exactly one byte.

                const data = new Uint8Array([id]);


                if (bleCharacteristic.properties.write) {

                    await bleCharacteristic.writeValueWithResponse(
                        data
                    );

                }

                else if (
                    bleCharacteristic.properties.writeWithoutResponse
                ) {

                    await bleCharacteristic.writeValueWithoutResponse(
                        data
                    );

                }

                else {

                    throw new Error(
                        "Characteristic does not support writing."
                    );

                }


                const hex =
                    "0x" +
                    id.toString(16)
                        .padStart(2, "0")
                        .toUpperCase();


                addLog(
                    "TRANSMITTED: " +
                    commands[id] +
                    " | ID: " + id +
                    " | HEX: " + hex
                );

            }

            catch (error) {

                addLog(
                    "Transmission error: " + error.message
                );

            }
        }


        // ==========================================
        // 10. COMMAND CLASSIFICATION
        // ==========================================

        function classifyCommand(text) {

            const normalized = text

                .toUpperCase()

                .replace(/[^A-Z0-9\s]/g, " ")

                .replace(/\s+/g, " ")

                .trim();


            // Check longer and more critical commands first.

            const priority = [

                ["EMERGENCY", 5],

                ["MAYDAY", 6],

                ["STOP", 3],

                ["HELP", 4],

                ["OFF", 2],

                ["ON", 1]

            ];


            for (const [word, id] of priority) {

                const pattern = new RegExp(
                    "\\b" + word + "\\b"
                );

                if (pattern.test(normalized)) {

                    return id;

                }
            }

            return null;

        }


        // ==========================================
        // 11. PROCESS RECOGNIZED SPEECH
        // ==========================================

        async function processSpeech(text) {

            recognizedText.textContent = text;

            addLog("Recognized speech: " + text);


            const commandID =
                classifyCommand(text);


            if (commandID !== null) {

                const commandName =
                    commands[commandID];


                detectedCommand.textContent =
                    "Detected command: " + commandName;


                highlightCommand(commandID);


                addLog(
                    "Command classified: " + commandName
                );


                // Send only one command byte.

                await sendCommand(commandID);

            }

            else {

                detectedCommand.textContent =
                    "Detected command: No supported command";


                highlightCommand(null);


                addLog(
                    "No supported command detected."
                );

            }
        }


        // ==========================================
        // 12. INITIALIZE SPEECH RECOGNITION
        // ==========================================

        function initializeSpeechRecognition() {

            const SpeechRecognition =

                window.SpeechRecognition ||

                window.webkitSpeechRecognition;


            if (!SpeechRecognition) {

                addLog(
                    "Speech recognition is not supported by this browser."
                );

                return false;
            }


            recognition = new SpeechRecognition();


            // English speech recognition.

            recognition.lang = "en-US";


            // Capture one listening session.

            recognition.continuous = false;


            // Only process final speech results.

            recognition.interimResults = false;


            // Number of alternative recognition results.

            recognition.maxAlternatives = 3;


            recognition.onresult = function(event) {

                if (sessionEnded) {
                    return;
                }

                const result =
                    event.results[event.results.length - 1];


                if (result && result.isFinal) {

                    const transcript =
                        result[0].transcript.trim();

                    if (transcript) {

                        recognizedTranscript = transcript;

                    }
                }
            };


            recognition.onerror = function(event) {

                addLog(
                    "Speech recognition error: " + event.error
                );

                if (
                    event.error === "not-allowed" ||
                    event.error === "service-not-allowed"
                ) {

                    finishListening();

                }
            };


            recognition.onend = function() {

                finishListening();

            };


            return true;

        }


        // ==========================================
        // 13. START LISTENING FOR THREE SECONDS
        // ==========================================

        function startListening() {

            if (!bleCharacteristic) {

                addLog("Connect ESP32 first.");

                return;
            }


            if (isListening) {
                return;
            }


            if (!recognition) {

                if (!initializeSpeechRecognition()) {

                    return;

                }
            }


            recognizedTranscript = "";

            sessionEnded = false;


            recognizedText.textContent =
                "Listening...";


            detectedCommand.textContent =
                "Detected command: Waiting";


            highlightCommand(null);


            try {

                isListening = true;


                listenButton.textContent =
                    "Listening...";


                listenButton.classList.add("listening");


                addLog(
                    "Microphone activated for 3 seconds."
                );


                recognition.start();


                // Automatically stop after 3 seconds.

                listeningTimer = setTimeout(() => {

                    if (isListening) {

                        addLog(
                            "Three seconds completed."
                        );

                        finishListening();

                    }

                }, 3000);


            }

            catch (error) {

                isListening = false;

                listenButton.textContent =
                    "Start Listening";

                listenButton.classList.remove("listening");

                addLog(
                    "Could not start microphone: " +
                    error.message
                );

            }
        }


        // ==========================================
        // 14. FINISH LISTENING AND PROCESS ONCE
        // ==========================================

        async function finishListening() {

            if (sessionEnded) {
                return;
            }

            sessionEnded = true;

            clearTimeout(listeningTimer);


            const finalText =
                recognizedTranscript.trim();


            isListening = false;


            listenButton.textContent =
                "Start Listening";


            listenButton.classList.remove("listening");


            // Stop browser recognition if it is still active.

            if (recognition) {

                try {

                    recognition.stop();

                }

                catch (error) {

                    // Recognition may already have stopped.

                }
            }


            addLog("Microphone deactivated.");


            if (finalText.length > 0) {

                await processSpeech(finalText);

            }

            else {

                recognizedText.textContent =
                    "No speech detected.";

                detectedCommand.textContent =
                    "Detected command: None";

                highlightCommand(null);

                addLog(
                    "No speech was recognized."
                );

            }
        }


        // ==========================================
        // 15. MANUAL STOP LISTENING
        // ==========================================

        function stopListening() {

            if (!isListening) {
                return;
            }

            finishListening();

        }


        // ==========================================
        // 16. BUTTON EVENTS
        // ==========================================

        connectButton.addEventListener(
            "click",
            connectBLE
        );


        listenButton.addEventListener(
            "click",
            function() {

                if (isListening) {

                    stopListening();

                }

                else {

                    startListening();

                }

            }
        );

    </script>

</body>

</html>
